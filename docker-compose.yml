# IoT stack: ESP32 -> MQTT -> Node-RED -> PostgreSQL -> Grafana (za Caddy s HTTPS)
# Spuštění:  docker compose up -d
# Hesla a citlivé údaje jsou v souboru .env (vzor: .env.example)

services:
  # --- Databáze --------------------------------------------------------------
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: iot_db
    volumes:
      - postgres_data:/var/lib/postgresql
      # SQL skripty se spustí jen při prvním startu (prázdná databáze)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # port 5432 schválně není publikovaný ven – DB je dostupná jen uvnitř Docker sítě
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MQTT broker -----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  # --- Zpracování dat --------------------------------------------------------
  nodered:
    image: nodered/node-red
    container_name: nodered
    restart: unless-stopped
    # jen localhost – přístup přes SSH tunel (viz README)
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # --- Vizualizace -----------------------------------------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    # ven jde jen přes Caddy (HTTPS); localhost pro SSH tunel
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # platí jen při úplně prvním startu (prázdný volume)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

  # --- HTTPS reverse proxy -------------------------------------------------
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana

  # --- Správa DB (webové GUI) ------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    # jen localhost – přístup přes SSH tunel (viz README)
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # --- Správa Dockeru (webové GUI) -------------------------------------------
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: always
    # jen localhost – přístup přes SSH tunel (viz README)
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

# Pevné názvy volumů = při přechodu z "docker run" se použijí stávající data
volumes:
  postgres_data:
    name: postgres_data
  mosquitto_data:
    name: mosquitto_data
  nodered_data:
    name: nodered_data
  grafana_data:
    name: grafana_data
  pgadmin_data:
    name: pgadmin_data
  portainer_data:
    name: portainer_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
